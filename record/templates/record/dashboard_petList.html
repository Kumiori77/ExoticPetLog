{% extends 'layout.html' %} {% block content %} <br /><br />
<div class="text-center">
  <h1>애완동물 관리 명단</h1>
  <br /><br /><br />
  <form method="post">
    {% csrf_token %}

    <div id="petForm" style="font-size: 19px">
      {% for pet in petList %} 
      
        <h4>{{ pet.name }} - {{ pet.species}}
        {% if pet.id in joinedPet %}
          <input type="checkbox" name="pcheckedPets" value="{{ pet.id }}" checked />
        {% else %}
          <input type="checkbox" name="pcheckedPets" value="{{ pet.id }}" />
        {% endif %}
        </h4>
        <br>

      {% empty %} No pet.. {% endfor %}
    </div>
    <br />
    <button class="btn btn-secondary" style="width: 150px">등록</button>

  </form>
</div>
<br><br><br>
{% endblock %}
